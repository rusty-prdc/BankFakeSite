<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Баннер BankFake 2.2 — XPRODC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #111319; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Golos Text', sans-serif; }

  .poster {
    position: relative;
    width: 1200px;
    height: 675px;
    overflow: hidden;
    background:
      radial-gradient(900px 500px at 88% -10%, rgba(249, 115, 22, .28), transparent 60%),
      radial-gradient(700px 520px at -8% 110%, rgba(124, 58, 237, .22), transparent 60%),
      linear-gradient(150deg, #0b0d12 0%, #090a0d 55%, #12101a 100%);
    color: #fff;
    transform-origin: top left;
  }

  /* декор */
  .web { position: absolute; top: 0; left: 0; width: 150px; color: rgba(255, 165, 80, .45); }
  .bat { position: absolute; fill: #17131f; opacity: .9; }
  .bat.b1 { width: 74px; top: 64px; right: 405px; animation: fl 7s ease-in-out infinite; }
  .bat.b2 { width: 52px; top: 132px; right: 330px; opacity: .75; animation: fl 9s ease-in-out infinite reverse; }
  .pump-svg { position: absolute; right: 46px; bottom: 34px; width: 76px; transform: rotate(8deg); filter: drop-shadow(0 10px 24px rgba(249,115,22,.45)); animation: fl 8s ease-in-out infinite; }
  @keyframes fl { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(5deg); } }

  .inner { position: relative; z-index: 2; height: 100%; padding: 54px 64px; display: flex; flex-direction: column; }

  /* шапка */
  .brandrow { display: flex; align-items: center; gap: 16px; }
  .brandrow img { width: 56px; height: 56px; border-radius: 14px; }
  .brandname { font-family: Unbounded, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .06em; }
  .ver {
    margin-left: auto;
    font-family: Unbounded, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .18em;
    color: #ffb26b;
    border: 1.5px solid rgba(255, 150, 60, .55);
    background: rgba(249, 115, 22, .12);
    padding: 10px 20px;
    border-radius: 999px;
  }

  /* центр */
  .mid { display: flex; gap: 54px; flex: 1; align-items: center; }
  .left { flex: 1; min-width: 0; }
  .kicker {
    font-weight: 800;
    font-size: 17px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: #ff8c42;
    margin-bottom: 6px;
  }
  .bignum {
    font-family: Unbounded, sans-serif;
    font-weight: 800;
    font-size: 158px;
    line-height: .96;
    background: linear-gradient(92deg, #ffb04d 0%, #ff7a1a 45%, #9d4edd 115%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 2px 0 10px -6px;
  }
  .subtitle { font-size: 24px; font-weight: 700; line-height: 1.3; max-width: 560px; margin-bottom: 22px; }
  .subtitle em { font-style: normal; color: #ffb26b; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 600px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15.5px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid rgba(255, 255, 255, .16);
    background: rgba(255, 255, 255, .05);
    color: #e7e9ee;
    white-space: nowrap;
  }
  .chip svg { width: 17px; height: 17px; flex-shrink: 0; stroke: #ff8c42; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chip.hot { border-color: rgba(249, 115, 22, .7); background: rgba(249, 115, 22, .16); color: #ffb26b; }
  .chip.hot svg { stroke: #ffb26b; }

  /* телефон */
  .shot {
    position: relative;
    width: 300px;
    height: 500px;
    border-radius: 34px;
    border: 6px solid #1d2129;
    background: #000;
    box-shadow: 0 40px 90px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    transform: rotate(4deg) translateY(6px);
    flex-shrink: 0;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

  /* подвал */
  .foot { display: flex; align-items: center; justify-content: center; gap: 16px; border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 22px; }
  .devlabel { font-size: 17px; font-weight: 700; color: #8b90a0; letter-spacing: .1em; }
  .xlogo { display: flex; align-items: center; }
  .xlogo svg { display: block; }
</style>
</head>
<body>
<div class="poster" id="poster">
  <svg class="web" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M0 0 L110 0 M0 0 L101.6 42.1 M0 0 L77.8 77.8 M0 0 L42.1 101.6 M0 0 L0 110"/>
    <path d="M40 0 Q42.5 17.6 28.3 28.3 Q17.6 42.5 0 40"/>
    <path d="M75 0 Q79.7 33.1 53 53 Q33.1 79.7 0 75"/>
    <path d="M110 0 Q116.7 48.5 77.8 77.8 Q48.5 116.7 0 110"/>
  </svg>
  <svg class="bat b1" viewBox="0 0 64 30"><path d="M32 4l-3 5c-5-4-11-6-18-5l4 4c-4 0-8 2-10 6 4-2 8-1 10 2-3 1-6 4-6 9 4-4 9-5 13-3 1 3 4 6 8 7l-3 3 3 1 2-2 2 2 3-1-2-2c4-1 7-4 8-7 4 2 7-1 11 5-1-5-4-8-8-9 2-3 5-4 10-2-2-4-6-6-10-6l4-4c-7-1-13 1-18 5z"/></svg>
  <svg class="bat b2" viewBox="0 0 64 30"><path d="M32 4l-3 5c-5-4-11-6-18-5l4 4c-4 0-8 2-10 6 4-2 8-1 10 2-3 1-6 4-6 9 4-4 9-5 13-3 1 3 4 6 8 7l-3 3 3 1 2-2 2 2 3-1-2-2c4-1 7-4 8-7 4 2 7-1 11 5-1-5-4-8-8-9 2-3 5-4 10-2-2-4-6-6-10-6l4-4c-7-1-13 1-18 5z"/></svg>
  <svg class="pump-svg" viewBox="0 0 140 130" aria-hidden="true">
    <defs>
      <radialGradient id="pmpG" cx="50%" cy="42%" r="68%">
        <stop offset="0%" stop-color="#ffa04d"/>
        <stop offset="62%" stop-color="#ff7a1a"/>
        <stop offset="100%" stop-color="#e8590c"/>
      </radialGradient>
    </defs>
    <path d="M70 32c0-9 5-17 14-21-3 5 0 12 5 14 6 2 9 8 8 15-4-7-11-11-18-10l-4 2z" fill="#15803d"/>
    <ellipse cx="70" cy="80" rx="58" ry="46" fill="url(#pmpG)"/>
    <ellipse cx="42" cy="80" rx="29" ry="45" fill="#f97316" opacity=".5"/>
    <ellipse cx="98" cy="80" rx="29" ry="45" fill="#f97316" opacity=".5"/>
    <g fill="#ffd43b">
      <path d="M44 62l15 19H29z"/>
      <path d="M96 62l15 19H81z"/>
      <path d="M40 94c10 13 50 13 60 0-3 15-16 24-30 24s-27-9-30-24z"/>
    </g>
  </svg>

  <div class="inner">
    <div class="brandrow">
      <img src="../assets/icon.png" alt="BankFake">
      <span class="brandname">BANKFAKE</span>
      <span class="ver">ОБНОВЛЕНИЕ 2.2</span>
    </div>

    <div class="mid">
      <div class="left">
        <div class="kicker">Масштабное обновление</div>
        <div class="bignum">2.2</div>
        <div class="subtitle">Вклады, копилки, акции и курсы валют, кредит и ипотека, <em>ИИ-отчёты по тратам</em> и виджеты</div>
        <div class="chips">
          <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8"/><path d="M4 21h16"/></svg>Вклады</span>
          <span class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>Копилки</span>
          <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Акции</span>
          <span class="chip"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="15" r="5"/></svg>Валюта ЦБ</span>
          <span class="chip"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>Кредит и ипотека</span>
          <span class="chip"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="10" rx="3"/><circle cx="9.5" cy="13" r="1.2"/><circle cx="14.5" cy="13" r="1.2"/><path d="M12 5v3"/><circle cx="12" cy="4.5" r="1"/></svg>ИИ-отчёты</span>
          <span class="chip"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h5M9.5 16h5"/></svg>CSV и чеки</span>
          <span class="chip"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>PIN-код</span>
          <span class="chip"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Виджеты</span>
          <span class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/></svg>BF-Pay</span>
          <span class="chip hot"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="14.5" rx="8" ry="6.5"/><path d="M12 8V5"/><path d="M12 5c1.2-1.8 3.4-2.2 5-1.2"/></svg>Хэллоуин</span>
        </div>
      </div>

      <div class="shot">
        <img src="../assets/screenshots/promo-ui.jpg" alt="BankFake 2.2">
      </div>
    </div>

    <div class="foot">
      <span class="devlabel">By</span>
      <div class="xlogo">
        <svg width="212" height="52" viewBox="0 0 212 52" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="xText" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#1668f0"/>
              <stop offset="52%" stop-color="#5b3df0"/>
              <stop offset="100%" stop-color="#a02ce0"/>
            </linearGradient>
          </defs>
          <text x="2" y="37" font-family="Unbounded, sans-serif" font-weight="800" font-size="34" letter-spacing="1" fill="url(#xText)">XPRODC</text>
        </svg>
      </div>
    </div>
  </div>
</div>
<script>
  function fit() {
    var p = document.getElementById('poster');
    var s = Math.min(window.innerWidth / 1200, window.innerHeight / 675, 1);
    p.style.transform = 'scale(' + s + ')';
    document.body.style.display = 'block';
    document.body.style.overflow = 'hidden';
  }
  fit(); window.addEventListener('resize', fit);
</script>
</body>
</html>
